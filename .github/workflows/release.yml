name: Release APK

# Publishes a shrunk, installable release APK to this repo's Releases page.
# Trigger by pushing a version tag (e.g. `git tag v1.0 && git push origin v1.0`)
# or by running this workflow manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk personal-file-scraper.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: personal-file-scraper.apk
